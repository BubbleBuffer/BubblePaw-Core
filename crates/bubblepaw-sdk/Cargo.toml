[package]
name = "bubblepaw-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["host"]
# The embedded host: `Host`, `HostBuilder`, the embedded `Client` constructors,
# the store, harness and tool surface, and serving a host to paired devices.
# Without it only the remote client builds: `Client::connect_remote` and
# `Client::attach`, `remote::pair`, saved hosts, `remote::probe_host` and the
# device key.
host = ["bubblepaw-runner/host"]
# The optional local web host, re-exported from bubblepaw-runner.
web = ["host", "bubblepaw-runner/web"]

[lib]
name = "bubblepaw_sdk"

# One binary for every test of the embedded host; the host-less build skips it.
[[test]]
name = "host"
required-features = ["host"]

[[example]]
name = "scripted_chat"
required-features = ["host"]

[dependencies]
bubblepaw-core = { path = "../bubblepaw-core" }
bubblepaw-runner = { path = "../bubblepaw-runner", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
bubblepaw-remote = { path = "../bubblepaw-remote" }
async-trait.workspace = true
tempfile.workspace = true

[lints]
workspace = true
