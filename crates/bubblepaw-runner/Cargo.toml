[package]
name = "bubblepaw-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["host"]
# The embedded host: the harness, store, tools, MCP, process control, the
# host API and its serving side of remote access. Without it the crate keeps
# only the client side (pairing, saved hosts, the device key, and a host-API
# client over a tunnel or a published endpoint).
host = [
    "dep:bubblepaw-mcp",
    "dep:bubblepaw-process",
    "dep:getrandom",
    "dep:serde_yaml",
    "dep:toml",
    "dep:toml_edit",
    "dep:uuid",
    "dep:rusqlite",
    "dep:httpdate",
    "dep:reqwest",
    "dep:sha2",
    "dep:regex",
    "dep:html2text",
    "dep:rquickjs",
    "dep:clap",
    "dep:tiktoken-rs",
    "dep:tracing-subscriber",
    "dep:qrcode",
    "dep:futures-util",
    "dep:base64",
]
web = ["host", "dep:axum"]
# Episode-replay and probe benchmark code.
bench = ["host"]
# Builds native fixture binaries the integration tests spawn.
test-fixtures = ["host"]

[lib]
name = "bubblepaw_runner"

[[bin]]
name = "bubblepaw"
path = "src/main.rs"
required-features = ["host"]

# Dev-only episode prompt v2/v3 comparison (docs/lcm-episode-v3-comparison.md).
[[bin]]
name = "bubblepaw-episode-prompt-bench"
path = "src/bin/episode_prompt_bench.rs"
required-features = ["bench"]

# Test fixture for the out-of-process provider extension host.
[[bin]]
name = "bubblepaw-fake-extension"
path = "src/bin/fake_extension.rs"
required-features = ["test-fixtures"]

# Reuse the MCP crate's fixture so runner tests also build it when run alone.
[[bin]]
name = "bubblepaw-runner-fake-mcp"
path = "../bubblepaw-mcp/src/bin/fake_mcp.rs"
required-features = ["test-fixtures"]

# Stand-in for cloudflared in the remote tunnel tests.
[[bin]]
name = "bubblepaw-fake-cloudflared"
path = "src/bin/fake_cloudflared.rs"
required-features = ["test-fixtures"]

# Native argv roundtrip fixture; tests copy it into their isolated workspace.
[[bin]]
name = "bubblepaw-argv-probe"
path = "tests/support/argv_probe.rs"
required-features = ["test-fixtures"]

[dependencies]
bubblepaw-core = { path = "../bubblepaw-core" }
bubblepaw-mcp = { path = "../bubblepaw-mcp", optional = true }
bubblepaw-process = { path = "../bubblepaw-process", optional = true }
bubblepaw-remote = { path = "../bubblepaw-remote" }
anyhow.workspace = true
base64 = { version = "0.23", optional = true }
async-trait.workspace = true
chrono.workspace = true
fs2 = "0.4"
getrandom = { version = "0.3", optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml = { version = "0.9", optional = true }
toml = { version = "1.1", optional = true }
toml_edit = { version = "0.25", features = ["serde"], optional = true }
tokio = { workspace = true, features = ["net"] }
uuid = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tempfile.workspace = true
futures-util = { version = "0.3", optional = true }
httpdate = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
sha2 = { version = "0.11", optional = true }
regex = { version = "1", optional = true }
html2text = { version = "=0.17.4", optional = true }
rquickjs = { version = "0.14", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tiktoken-rs = { version = "0.12", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
zeroize = "1.9"
axum = { version = "0.8", optional = true }

[dev-dependencies]
axum = "0.8"
# The fake HTTPS provider of the model-egress tests (a certificate made per run).
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Enables the fixture binaries for this crate's own tests.
bubblepaw-runner = { path = ".", features = ["test-fixtures"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true
