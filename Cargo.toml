[workspace]
members = ["crates/bubblepaw-core", "crates/bubblepaw-mcp", "crates/bubblepaw-process", "crates/bubblepaw-runner", "crates/bubblepaw-sdk"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"
description = "A small Rust agent harness with a SQLite session store"
repository = "https://github.com/BubbleBuffer/BubblePaw-Core"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs", "signal"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[workspace.lints.clippy]
all = "warn"
