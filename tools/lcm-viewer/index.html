<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCM viewer</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f6f2; --panel: #ffffff; --ink: #22211f; --muted: #6d6a63; --line: #dedbd2;
  --accent: #2c64a8; --accent-ink: #ffffff; --code: #f2f0ea; --warn: #8a5300; --err: #a12a2a;
  --sel: #fff1b8; --r-user: #2c64a8; --r-assistant: #2f7d4d; --r-tool: #6f4f94; --r-system: #8a6d2f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16161a; --panel: #1e1e24; --ink: #e9e7e1; --muted: #9b978d; --line: #33323a;
    --accent: #7fb0ff; --accent-ink: #0d1220; --code: #25252d; --warn: #f0b353; --err: #ff8a8a;
    --sel: #3d3520; --r-user: #7fb0ff; --r-assistant: #7fd19b; --r-tool: #c3a6ec; --r-system: #e0c27a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
header.top { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); height: 48px; }
header.top h1 { font-size: 15px; margin: 0; }
header.top .status { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.link { border: none; background: none; padding: 0; color: var(--accent); }
button.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr) 370px; height: calc(100% - 48px); }
.layout > aside, .layout > main { overflow: auto; min-height: 0; }
#sources { border-right: 1px solid var(--line); background: var(--panel); padding: 8px 0; }
#sources h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 12px 4px; font-weight: 600; }
#sources .src { display: block; width: 100%; text-align: left; border: none; border-radius: 0; padding: 6px 12px 6px 14px; background: none; }
#sources .src[aria-current="true"] { background: var(--sel); }
#sources .src .name { display: block; overflow-wrap: anywhere; }
#sources .src .meta { display: block; color: var(--muted); font-size: 12px; }
#sources .src .err { color: var(--err); font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
main { padding: 0 16px 24px; }
.srcbar { position: sticky; top: 0; background: var(--bg); padding: 10px 0 6px; z-index: 2; border-bottom: 1px solid var(--line); }
.srcbar .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.srcbar .facts { color: var(--muted); font-size: 12px; }
.warnbox { color: var(--warn); font-size: 12px; margin-top: 4px; }
.errbox { color: var(--err); font-size: 13px; margin: 10px 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#filter { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 220px; }
select { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); max-width: 100%; }
.msg { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 4px 0 8px; border-bottom: 1px solid var(--line); }
.msg .gut { border-radius: 4px; cursor: pointer; min-height: 24px; }
.msg.sel .body { background: var(--sel); border-radius: 6px; }
.msg .body { padding: 2px 4px; }
.mh { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); cursor: pointer; }
.mh .seq { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.role { font-weight: 600; text-transform: lowercase; }
.r-user { color: var(--r-user); } .r-assistant { color: var(--r-assistant); } .r-tool { color: var(--r-tool); } .r-system { color: var(--r-system); } .r-unparsed { color: var(--err); }
.err-flag { color: var(--err); font-weight: 600; }
.content { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
.ep-head { margin: 14px 0 4px; padding: 6px 10px; border-left: 4px solid; background: var(--panel); border-radius: 0 6px 6px 0; cursor: pointer; font-size: 13px; }
.ep-head b { font-weight: 600; }
.ep-head span { color: var(--muted); }
.ch-head { margin: 22px 0 0; padding: 4px 0; border-bottom: 2px solid var(--ink); font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.ch-head span { color: var(--muted); font-weight: 400; }
details { margin-top: 4px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--code); padding: 8px 10px; border-radius: 6px; max-height: 60vh; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, "Cascadia Mono", monospace; margin: 6px 0; }
.more { margin-top: 2px; font-size: 12px; }
.muted { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
.card h3 { margin: 0 0 4px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
.grid2 dt { color: var(--muted); }
.grid2 dd { margin: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; margin: 2px 4px 2px 0; }
.grade-supported { color: #2f7d4d; } .grade-unsupported, .grade-contradicted { color: var(--err); }
table.calls { border-collapse: collapse; width: 100%; font-size: 13px; }
table.calls th, table.calls td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.calls td.num, table.calls th.num { text-align: right; }
.det-title { font-size: 15px; font-weight: 600; margin: 0 0 6px; overflow-wrap: anywhere; }
.sectitle { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
.listrow { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 9px; margin: 4px 0; }
.listrow .t { font-weight: 600; overflow-wrap: anywhere; }
.listrow .s { color: var(--muted); font-size: 12px; }
#details { border-left: 1px solid var(--line); background: var(--panel); padding: 10px 14px 24px; }
#details .empty { color: var(--muted); }
#timeline-count { color: var(--muted); font-size: 12px; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .layout > aside, .layout > main { overflow: visible; }
  #sources { border-right: none; border-bottom: 1px solid var(--line); max-height: 40vh; overflow: auto; }
  #details { border-left: none; border-top: 1px solid var(--line); }
  main { padding: 0 16px 24px; }
  #filter { min-width: 0; width: 100%; }
}
</style>
</head>
<body>
<header class="top">
  <h1>LCM viewer</h1>
  <div class="status" id="status">Loading sources...</div>
  <button id="rescan" type="button" title="Rescan the store directories for chats">Rescan</button>
</header>
<div class="layout">
  <aside id="sources" aria-label="Sources"></aside>
  <main id="main">
    <div class="srcbar" id="srcbar" hidden>
      <div class="row">
        <select id="session" aria-label="Session" hidden></select>
        <span class="facts" id="facts"></span>
      </div>
      <div class="warnbox" id="schema-note" hidden></div>
      <div class="errbox" id="src-error" hidden></div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <div id="empty" class="muted" style="padding-top:24px">Pick a source on the left.</div>

    <section id="pane-timeline" hidden>
      <div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0">
        <input id="filter" type="search" placeholder="Filter messages (text, tool calls, role)" aria-label="Filter messages">
        <span id="timeline-count"></span>
      </div>
      <div id="timeline"></div>
    </section>

    <section id="pane-episodes" hidden>
      <div id="episodes"></div>
    </section>

    <section id="pane-final" hidden>
      <div id="final"></div>
    </section>

    <section id="pane-probes" hidden>
      <div id="probes"></div>
    </section>

    <section id="pane-report" hidden>
      <div id="report"></div>
    </section>
  </main>
  <aside id="details" aria-label="Details">
    <div class="empty">Select an episode band, a message or an episode entry.</div>
  </aside>
</div>

<script>
(() => {
  "use strict";

  // ---------- small helpers (DOM only; no innerHTML, chat text is data) ----------
  const $ = (sel) => document.querySelector(sel);
  const COLLAPSE_CHARS = 1200;

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k === "dataset") Object.assign(el.dataset, v);
        else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : String(v));
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  const fmtInt = (n) => (typeof n === "number" ? n.toLocaleString("en-US") : "-");
  const fmtUsd = (x) => {
    if (typeof x !== "number") return "-";
    return "$" + x.toFixed(x < 0.01 ? 6 : 4);
  };
  const fmtPct = (p) => (typeof p === "number" ? (p * 100).toFixed(1) + "%" : "-");
  const short = (s, n = 12) => (typeof s === "string" && s.length > n ? s.slice(0, n) + "..." : s ?? "-");
  const epColor = (ord) => `hsl(${(ord * 67) % 360} 62% 52%)`;
  const UNCOVERED = "#9a9a94";

  function setStatus(text) { $("#status").textContent = text || ""; }

  async function getJSON(url) {
    const r = await fetch(url, { headers: { Accept: "application/json" } });
    let body = null;
    try { body = await r.json(); } catch (_) { body = null; }
    if (!r.ok) throw new Error((body && body.error) || `HTTP ${r.status}`);
    return body;
  }

  function rawBlock(label, value) {
    const pre = h("pre", { hidden: true }, JSON.stringify(value, null, 2));
    const btn = h("button", { type: "button", class: "more", onclick: () => {
      pre.hidden = !pre.hidden;
      btn.textContent = pre.hidden ? label : "Hide " + label.toLowerCase();
    } }, label);
    return h("div", null, btn, pre);
  }

  // Long text with expand/collapse. Returns a container element.
  function longText(text, cls) {
    const full = typeof text === "string" ? text : (text === null || text === undefined ? "" : JSON.stringify(text, null, 2));
    if (full.length <= COLLAPSE_CHARS) return h("div", { class: cls || "content" }, full);
    const box = h("div", { class: cls || "content" });
    let expanded = false;
    const btn = h("button", { type: "button", class: "more link" });
    const paint = () => {
      box.textContent = expanded ? full : full.slice(0, COLLAPSE_CHARS) + " ...";
      btn.textContent = expanded ? "Collapse" : `Show all (${fmtInt(full.length)} chars)`;
    };
    btn.addEventListener("click", (e) => { e.stopPropagation(); expanded = !expanded; paint(); });
    paint();
    return h("div", null, box, btn);
  }

  // ---------- state ----------
  const S = {
    sources: [], srcId: null, srcSummary: null, sessionId: null, detail: null, replay: null,
    tab: "timeline", seq: null, ep: null, loadToken: 0,
    bySeq: new Map(), byMsgId: new Map(), epByOrd: new Map(), epOfSeq: new Map(),
    chapterById: new Map(), chapterByOrd: new Map(), decByEp: new Map(),
    msgEls: new Map(),
  };

  // ---------- sources sidebar ----------
  function renderSources() {
    const box = $("#sources");
    box.textContent = "";
    const groups = new Map();
    for (const src of S.sources) {
      if (!groups.has(src.group)) groups.set(src.group, []);
      groups.get(src.group).push(src);
    }
    if (!S.sources.length) box.append(h("div", { class: "muted", style: "padding:12px" }, "No chats found. Start the viewer with --data-dir pointing at a store (catalog.db and chats/)."));
    for (const [group, items] of groups) {
      box.append(h("h2", null, group === "." ? "(root)" : group));
      for (const src of items) {
        const c = src.counts || {};
        const bits = [
          c.messages != null ? `${fmtInt(c.messages)} msg` : "no messages table",
          c.episodes ? `${c.episodes} ep` : null,
          c.subject_chapters ? `${c.subject_chapters} ch` : null,
          c.decisions ? `${c.decisions} dec` : null,
          src.sessions > 1 ? `${src.sessions} sessions` : null,
          src.schema_version != null ? `v${src.schema_version}` : null,
          src.workspace ? src.workspace.split(/[\\/]/).filter(Boolean).pop() : null,
        ].filter(Boolean).join(" · ");
        const btn = h("button", {
          type: "button", class: "src", "aria-current": S.srcId === src.id ? "true" : "false",
          title: src.display + (src.workspace ? " | workspace: " + src.workspace : ""), onclick: () => openSource(src.id, null),
        },
          h("span", { class: "name" }, src.name, src.has_replay ? h("span", { class: "tag" }, "replay") : null, src.storage_state === "archived" ? h("span", { class: "tag" }, "archived") : null),
          h("span", { class: "meta" }, bits),
          src.error ? h("span", { class: "err" }, "error: " + src.error) : null,
        );
        box.append(btn);
      }
    }
  }

  // ---------- indexes over the loaded session ----------
  function buildIndexes(d) {
    S.bySeq = new Map(); S.byMsgId = new Map();
    for (const m of d.messages) { S.bySeq.set(m.seq, m); if (m.id) S.byMsgId.set(m.id, m.seq); }
    S.epByOrd = new Map(); S.epOfSeq = new Map();
    for (const ep of d.episodes) {
      S.epByOrd.set(ep.ordinal, ep);
      for (let s = ep.first_seq; s <= ep.last_seq; s++) S.epOfSeq.set(s, ep.ordinal);
    }
    S.chapterById = new Map(); S.chapterByOrd = new Map();
    for (const ch of d.chapters) { S.chapterById.set(ch.id, ch); S.chapterByOrd.set(ch.ordinal, ch); }
    S.decByEp = new Map();
    for (const dec of d.decisions) {
      if (!S.decByEp.has(dec.episode_ordinal)) S.decByEp.set(dec.episode_ordinal, []);
      S.decByEp.get(dec.episode_ordinal).push(dec);
    }
  }

  function epTitle(ep) {
    const t = ep && ep.data && typeof ep.data.title === "string" ? ep.data.title : "";
    return t || `episode ${ep ? ep.ordinal : "?"}`;
  }
  function chTitle(ch) {
    if (!ch || !ch.data) return "";
    return ch.data.description || (ch.data.summary ? String(ch.data.summary).split("\n")[0].slice(0, 120) : "");
  }

  // ---------- message rendering ----------
  function toolNames(m) {
    return (m.tool_calls || []).map((c) => (c && (c.name || (c.function && c.function.name))) || "?");
  }

  function renderMessage(m) {
    const ord = S.epOfSeq.has(m.seq) ? S.epOfSeq.get(m.seq) : null;
    const role = m.role || "unknown";
    const gut = h("div", {
      class: "gut", title: ord != null ? `Episode ${ord}` : "not covered by an episode",
      style: `background:${ord != null ? epColor(ord) : UNCOVERED}`,
      onclick: (e) => { e.stopPropagation(); if (ord != null) selectEpisode(ord, false); },
    });
    const head = h("div", { class: "mh", onclick: () => selectMessage(m.seq) },
      h("span", { class: "seq" }, "#" + m.seq),
      h("span", { class: `role r-${role}` }, role),
      m.origin ? h("span", null, m.origin) : null,
      m.created_at ? h("span", null, m.created_at) : null,
      m.is_error ? h("span", { class: "err-flag" }, "error") : null,
      m.parse_error ? h("span", { class: "err-flag" }, "unparsed JSON") : null,
    );
    const body = h("div", { class: "body" }, head);
    if (role === "tool") {
      const text = typeof m.content === "string" ? m.content : JSON.stringify(m.content ?? "", null, 2);
      body.append(h("details", null,
        h("summary", null, `tool result (${fmtInt(text.length)} chars)`),
        longText(text, "content")));
      if (m.tool_call_id) body.append(h("div", { class: "muted", style: "font-size:12px" }, "call " + m.tool_call_id));
    } else if (m.content !== null && m.content !== undefined && m.content !== "") {
      body.append(longText(m.content, "content"));
    }
    if (Array.isArray(m.tool_calls) && m.tool_calls.length) {
      const names = toolNames(m);
      body.append(h("details", null,
        h("summary", null, `${m.tool_calls.length} tool call(s): ${names.join(", ")}`),
        h("pre", null, JSON.stringify(m.tool_calls, null, 2))));
    }
    const el = h("article", { class: "msg", dataset: { seq: String(m.seq), ep: ord != null ? String(ord) : "" } }, gut, body);
    return { el, ord };
  }

  function renderTimeline() {
    const tl = $("#timeline");
    tl.textContent = "";
    S.msgEls = new Map();
    const d = S.detail;
    const epsSorted = [...d.episodes].sort((a, b) => a.ordinal - b.ordinal);
    const epStartAt = new Map(epsSorted.map((ep) => [ep.first_seq, ep]));
    let prevChapter = undefined;
    const heads = [];
    if (!d.messages.length) {
      tl.append(h("div", { class: "muted" }, "This session has no messages table rows."));
    }
    for (const m of d.messages) {
      const starting = epStartAt.get(m.seq);
      if (starting) {
        if (starting.chapter_id !== prevChapter) {
          const ch = S.chapterById.get(starting.chapter_id);
          const label = ch ? `Chapter ${ch.ordinal}` : `Chapter (${short(starting.chapter_id, 8)})`;
          const desc = ch ? chTitle(ch) : "";
          const chHead = h("div", { class: "ch-head", dataset: { chap: starting.chapter_id || "" } },
            label, desc ? h("span", null, " · " + desc) : null);
          tl.append(chHead);
          heads.push({ el: chHead, ord: null });
          prevChapter = starting.chapter_id;
        }
        const epHead = h("div", {
          class: "ep-head", style: `border-color:${epColor(starting.ordinal)}`,
          dataset: { epHead: String(starting.ordinal) },
          onclick: () => selectEpisode(starting.ordinal, false),
        },
          h("b", null, `Episode ${starting.ordinal}`), " · ", epTitle(starting),
          h("span", null, `  seq ${starting.first_seq}–${starting.last_seq}`));
        tl.append(epHead);
        heads.push({ el: epHead, ord: starting.ordinal });
      }
      const { el, ord } = renderMessage(m);
      S.msgEls.set(m.seq, el);
      tl.append(el);
      if (ord == null && !heads.length) { /* leading uncovered messages */ }
    }
    S.heads = heads;
    applyFilter();
  }

  function applyFilter() {
    const q = ($("#filter").value || "").trim().toLowerCase();
    let shown = 0;
    const visibleEps = new Set();
    for (const [seq, el] of S.msgEls) {
      const m = S.bySeq.get(seq);
      const hay = q ? [m.role, m.content, m.tool_call_id, JSON.stringify(m.tool_calls || [])].join("\n").toLowerCase() : "";
      const ok = !q || hay.includes(q);
      el.hidden = !ok;
      if (ok) {
        shown++;
        const ord = el.dataset.ep ? Number(el.dataset.ep) : null;
        if (ord !== null) visibleEps.add(ord);
      }
    }
    // Episode and chapter headings: keep only where an episode has visible messages.
    for (const { el, ord } of S.heads || []) {
      if (ord === null) continue;
      el.hidden = q ? !visibleEps.has(ord) : false;
    }
    $("#timeline-count").textContent = q ? `${shown} of ${S.msgEls.size} messages` : `${S.msgEls.size} messages`;
  }

  function highlightSeq(seq, { scroll = true } = {}) {
    for (const el of document.querySelectorAll(".msg.sel")) el.classList.remove("sel");
    const el = S.msgEls.get(seq);
    if (!el) return false;
    if (el.hidden) { $("#filter").value = ""; applyFilter(); }
    el.classList.add("sel");
    if (scroll) el.scrollIntoView({ block: "center", behavior: "auto" });
    return true;
  }

  // ---------- details panel ----------
  function detailsEl() { return $("#details"); }
  function setDetails(...nodes) {
    const box = detailsEl();
    box.textContent = "";
    box.append(...nodes.flat());
    box.scrollTop = 0;
  }
  function dlRows(pairs) {
    const dl = h("dl", { class: "grid2" });
    for (const [k, v] of pairs) {
      if (v === null || v === undefined || v === "") continue;
      dl.append(h("dt", null, k), h("dd", null, v));
    }
    return dl;
  }

  function showEpisode(ord) {
    const ep = S.epByOrd.get(ord);
    if (!ep) { setDetails(h("div", { class: "empty" }, "No episode " + ord)); return; }
    const data = ep.data || {};
    const ch = S.chapterById.get(ep.chapter_id);
    const decs = S.decByEp.get(ord) || [];
    const nodes = [
      h("div", { class: "det-title" }, `Episode ${ep.ordinal}: ${epTitle(ep)}`),
      dlRows([
        ["Source range", `seq ${ep.first_seq}–${ep.last_seq} (${fmtInt(ep.last_seq - ep.first_seq + 1)} messages)`],
        ["Message ids", `${data.first_message_id || "-"} … ${data.last_message_id || "-"}`],
        ["Chapter", ch ? `Chapter ${ch.ordinal}: ${chTitle(ch)}` : short(ep.chapter_id, 16)],
        ["Source tokens", fmtInt(data.source_tokens)],
        ["Summary cap", fmtInt(data.cap)],
        ["Model", data.model],
        ["Usage", data.usage ? `in ${fmtInt(data.usage.input_tokens)} · out ${fmtInt(data.usage.output_tokens)}` : null],
        ["Created", data.created_at],
      ]),
      h("button", { type: "button", class: "more", onclick: () => selectSeqFromDetails(ep.first_seq) }, `Jump to first message (#${ep.first_seq})`),
      h("div", { class: "sectitle" }, "Summary"),
      longText(data.summary ?? "(no summary)", "content"),
    ];
    if (decs.length) {
      nodes.push(h("div", { class: "sectitle" }, "Split decision"));
      for (const dec of decs) nodes.push(decisionEl(dec));
    } else {
      nodes.push(h("div", { class: "sectitle" }, "Split decision"), h("div", { class: "muted" }, "None recorded for this episode."));
    }
    if (data.reasoning) {
      nodes.push(h("details", null, h("summary", null, "Reasoning"), longText(data.reasoning, "content")));
    }
    nodes.push(rawBlock("Show raw JSON", ep));
    setDetails(nodes);
  }

  function decisionEl(dec) {
    const d = dec.data || {};
    const opts = Array.isArray(d.option_message_ids) ? d.option_message_ids : [];
    const probs = Array.isArray(d.probabilities) ? d.probabilities : [];
    const rows = [];
    probs.forEach((p, i) => {
      let label;
      if (i < opts.length) {
        const seq = S.byMsgId.get(opts[i]);
        label = seq != null
          ? h("button", { type: "button", class: "link", onclick: () => selectSeqFromDetails(seq) }, `option ${i + 1} · ${opts[i]} (#${seq})`)
          : `option ${i + 1} · ${opts[i]}`;
      } else if (probs.length === opts.length + 1 && i === probs.length - 1) {
        label = "none (no split)";
      } else {
        label = `index ${i}`;
      }
      rows.push(h("div", null, label, " · p = ", h("b", null, fmtPct(p))));
    });
    const noneIdx = probs.length === opts.length + 1 ? probs.length - 1 : -1;
    const splitP = noneIdx >= 0 && typeof probs[noneIdx] === "number" ? 1 - probs[noneIdx] : null;
    return h("div", { class: "card" },
      h("h3", null, `${dec.kind || "decision"} · ${dec.id ? short(dec.id, 8) : ""}`),
      dlRows([
        ["Model", d.model],
        ["Choice", d.choice === null || d.choice === undefined ? "none recorded" : JSON.stringify(d.choice)],
        ["1 − P(none)", splitP === null ? null : fmtPct(splitP)],
        ["Usage", d.usage ? `in ${fmtInt(d.usage.input_tokens)} · out ${fmtInt(d.usage.output_tokens)}` : null],
        ["Created", d.created_at],
      ]),
      rows.length ? h("div", { class: "sectitle" }, "Probabilities") : null,
      ...rows,
      d.reasoning ? h("details", null, h("summary", null, "Reasoning"), longText(d.reasoning, "content")) : null,
      rawBlock("Show raw JSON", dec),
    );
  }

  function showChapter(ch) {
    const data = ch.data || {};
    const eps = (S.detail.episodes || []).filter((e) => e.chapter_id === ch.id);
    setDetails(
      h("div", { class: "det-title" }, `Chapter ${ch.ordinal}`),
      dlRows([
        ["Status", ch.status],
        ["Episodes", `${ch.first_episode_ordinal}–${ch.last_episode_ordinal}`],
        ["Covered messages", eps.length ? `seq ${eps[0].first_seq}–${eps[eps.length - 1].last_seq}` : null],
        ["Model", data.model],
        ["Usage", data.usage ? `in ${fmtInt(data.usage.input_tokens)} · out ${fmtInt(data.usage.output_tokens)}` : null],
      ]),
      h("div", { class: "sectitle" }, "Description"),
      h("div", { class: "content" }, data.description || "-"),
      h("div", { class: "sectitle" }, "Summary"),
      longText(data.summary ?? "(no summary)", "content"),
      data.related_ids && data.related_ids.length ? h("div", { class: "sectitle" }, "Related ids") : null,
      data.related_ids && data.related_ids.length ? h("div", null, data.related_ids.map((x) => h("span", { class: "chip" }, String(x)))) : null,
      data.reasoning ? h("details", null, h("summary", null, "Reasoning"), longText(data.reasoning, "content")) : null,
      rawBlock("Show raw JSON", ch),
    );
  }

  function showMessage(seq) {
    const m = S.bySeq.get(seq);
    if (!m) { setDetails(h("div", { class: "empty" }, "No message " + seq)); return; }
    const ord = S.epOfSeq.has(seq) ? S.epOfSeq.get(seq) : null;
    setDetails(
      h("div", { class: "det-title" }, `Message #${seq} · ${m.role || "?"}`),
      dlRows([
        ["Id", m.id],
        ["Origin", m.origin],
        ["Created", m.created_at],
        ["Episode", ord != null ? `${ord}` : "not covered"],
        ["Tool call id", m.tool_call_id],
        ["Is error", m.is_error === undefined ? null : String(m.is_error)],
      ]),
      ord != null ? h("button", { type: "button", class: "more", onclick: () => selectEpisode(ord, false) }, `Show episode ${ord}`) : null,
      h("div", { class: "sectitle" }, "Content"),
      longText(m.content ?? "", "content"),
      Array.isArray(m.tool_calls) && m.tool_calls.length
        ? h("details", null, h("summary", null, `${m.tool_calls.length} tool call(s)`), h("pre", null, JSON.stringify(m.tool_calls, null, 2)))
        : null,
      rawBlock("Show raw JSON", m),
    );
  }

  function selectMessage(seq) {
    S.seq = seq; S.ep = null;
    highlightSeq(seq, { scroll: false });
    showMessage(seq);
    updateHash();
  }

  function selectSeqFromDetails(seq) {
    S.seq = seq; S.ep = null;
    if (S.tab !== "timeline") setTab("timeline");
    highlightSeq(seq, { scroll: true });
    showMessage(seq);
    updateHash();
  }

  function selectEpisode(ord, switchTab) {
    S.ep = ord; S.seq = null;
    showEpisode(ord);
    const ep = S.epByOrd.get(ord);
    if (switchTab !== false) {
      if (S.tab !== "timeline") setTab("timeline");
      if (ep) highlightSeq(ep.first_seq, { scroll: true });
    }
    updateHash();
  }

  // ---------- tabs ----------
  const TAB_LABELS = { timeline: "Timeline", episodes: "Episodes & chapters", final: "Final view", probes: "Probes", report: "Run report" };

  function availableTabs() {
    const d = S.detail, r = S.replay;
    const tabs = ["timeline"];
    if (d && (d.episodes.length || d.chapters.length || d.legacy_chapters.length || d.checkpoints.length)) tabs.push("episodes");
    if (d && d.view || (r && r.views && r.views.length)) tabs.push("final");
    if (r && r.probes && r.probes.length) tabs.push("probes");
    if (r && (r.report || r.calls)) tabs.push("report");
    return tabs;
  }

  function renderTabs() {
    const tabs = availableTabs();
    if (!tabs.includes(S.tab)) S.tab = "timeline";
    const bar = $("#tabs");
    bar.textContent = "";
    for (const t of tabs) {
      bar.append(h("button", {
        type: "button", class: "tab", role: "tab", "aria-selected": String(S.tab === t),
        onclick: () => setTab(t),
      }, TAB_LABELS[t]));
    }
    for (const name of Object.keys(TAB_LABELS)) {
      $("#pane-" + name).hidden = S.tab !== name || !tabs.includes(name);
    }
  }

  function setTab(name) {
    S.tab = name;
    renderTabs();
    if (name === "episodes") renderEpisodes();
    if (name === "final") renderFinal();
    if (name === "probes") renderProbes();
    if (name === "report") renderReport();
    updateHash();
  }

  // ---------- episodes & chapters ----------

          h("div", { class: "t" }, `Through seq ${cp.through_seq}`),
          h("div", { class: "s" }, summary.slice(0, 220) || "(no summary)")));

    const box = $("#final");

          longText(m.content ?? "", "content"),

      const sel = h("select", { "aria-label": "View text" });
      views.forEach((v) => sel.append(h("option", { value: v.name }, `${v.name} (${fmtInt(Math.round(v.bytes / 1024))} KB)`)));
      sel.value = views[views.length - 1].name;
      const pre = h("pre", null, "");
      let req = 0;
      const load = async (name) => {
        const mine = ++req;
        pre.textContent = `Loading ${name} ...`;
        try {
          const r = await fetch(`/api/sources/${S.srcId}/views/${encodeURIComponent(name)}`);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);

          if (mine === req) pre.textContent = text;

        p.grade_reason ? h("details", null, h("summary", null, "Judge reason"), longText(p.grade_reason, "content")) : null,
        h("div", { class: "muted", style: "font-size:12px;margin-top:4px" },

  // ---------- source header ----------
  function renderHeader() {
    const s = S.srcSummary, d = S.detail;
    const bar = $("#srcbar");
    bar.hidden = false;
    $("#empty").hidden = true;
    const c = (s && s.counts) || {};
    const facts = [
      s && s.schema_version != null ? `schema v${s.schema_version}` : null,
      `${fmtInt(c.messages)} messages`,
      c.episodes != null ? `${c.episodes} episodes` : null,
      c.subject_chapters != null ? `${c.subject_chapters} chapters` : null,
      c.decisions != null ? `${c.decisions} decisions` : null,
      c.views != null ? `${c.views} view` : null,
      c.checkpoints ? `${c.checkpoints} checkpoint` : null,
      c.legacy_chapters ? `${c.legacy_chapters} legacy chapter` : null,
    ].filter(Boolean);
    $("#facts").textContent = `${s.display} — ` + facts.join(" · ");
    const note = $("#schema-note");
    const missing = (d && d.tables && d.tables.missing) || [];
    note.hidden = !missing.length;
    note.textContent = missing.length ? `Tables not in this schema: ${missing.join(", ")} (shown as empty).` : "";
    const err = $("#src-error");
    err.hidden = !(s && s.error);
    err.textContent = s && s.error ? `Source error: ${s.error}` : "";
    const sel = $("#session");
    const ids = (d && d.sessions) || [];
    sel.textContent = "";
    if (ids.length > 1) {
      const titles = new Map(((d && d.session_info) || []).map((r) => [r.id, r.title]));
      for (const id of ids) sel.append(h("option", { value: id }, (titles.get(id) ? titles.get(id) + " · " : "") + short(id, 8)));
      sel.value = S.sessionId;
      sel.hidden = false;
    } else {
      sel.hidden = true;
    }
  }

  // ---------- loading ----------
  async function openSource(srcId, sessionId) {
    const token = ++S.loadToken;
    S.srcId = srcId;
    renderSources();
    setStatus("Loading...");
    try {
      const summary = await getJSON(`/api/sources/${srcId}`);
      if (token !== S.loadToken) return;
      const ids = summary.session_ids || [];
      const sid = sessionId && ids.includes(sessionId) ? sessionId : (ids[0] || null);
      const [detail, replay] = await Promise.all([
        sid ? getJSON(`/api/sources/${srcId}/sessions/${encodeURIComponent(sid)}`) : Promise.resolve(null),
        summary.has_replay ? getJSON(`/api/sources/${srcId}/replay`) : Promise.resolve(null),
      ]);
      if (token !== S.loadToken) return;
      S.srcSummary = summary;
      S.sessionId = sid;
      S.detail = detail || emptyDetail(summary);
      S.replay = replay;
      buildIndexes(S.detail);
      renderHeader();
      renderTabs();
      renderTimeline();
      setStatus(`${summary.display}${sid ? " · session " + short(sid, 8) : ""}`);
      if (S.tab === "episodes") renderEpisodes();
      if (S.tab === "final") renderFinal();
      if (S.tab === "probes") renderProbes();
      if (S.tab === "report") renderReport();
      setDetails(h("div", { class: "empty" }, "Select an episode band, a message or an episode entry."));
      S.seq = null; S.ep = null;
      updateHash();
    } catch (err) {
      if (token !== S.loadToken) return;
      setStatus("Error: " + err.message);
    }
  }

  function emptyDetail(summary) {
    return {
      source: summary, session: null, sessions: [], tables: { present: [], missing: [] },
      messages: [], episodes: [], chapters: [], legacy_chapters: [], checkpoints: [],
      decisions: [], view: null, warnings: [],
    };
  }

  // ---------- URL hash deep link ----------
  function updateHash() {
    if (!S.srcId) return;
    const p = new URLSearchParams();
    p.set("src", S.srcId);
    if (S.sessionId) p.set("session", S.sessionId);
    p.set("tab", S.tab);
    if (S.seq != null) p.set("seq", String(S.seq));
    if (S.ep != null) p.set("ep", String(S.ep));
    const next = "#" + p.toString();
    if (location.hash !== next) history.replaceState(null, "", next);
  }

  async function applyHash() {
    const p = new URLSearchParams(location.hash.replace(/^#/, ""));
    const src = p.get("src");
    const session = p.get("session");
    const tab = p.get("tab");
    const seq = p.get("seq") !== null ? Number(p.get("seq")) : null;
    const ep = p.get("ep") !== null ? Number(p.get("ep")) : null;
    if (src && src !== S.srcId) {
      await openSource(src, session);
    } else if (session && session !== S.sessionId && S.srcId) {
      await openSource(S.srcId, session);
    }
    if (!S.detail) return;
    if (tab && availableTabs().includes(tab) && tab !== S.tab) setTab(tab);
    if (seq !== null && S.bySeq.has(seq)) selectMessage(seq);
    else if (ep !== null && S.epByOrd.has(ep)) selectEpisode(ep, false);
  }

  // ---------- wiring ----------
  $("#filter").addEventListener("input", applyFilter);
  $("#session").addEventListener("change", (e) => openSource(S.srcId, e.target.value));
  $("#rescan").addEventListener("click", async () => {
    setStatus("Rescanning...");
    await loadSources(true);
    setStatus("Rescanned.");
  });
  window.addEventListener("hashchange", () => { applyHash().catch((e) => setStatus("Error: " + e.message)); });

  async function loadSources(force) {
    const data = await getJSON("/api/sources" + (force ? "?rescan=1" : ""));
    S.sources = data.sources || [];
    renderSources();
    const roots = (data.roots || []).map((r) => `${r.label} (${r.count})`).join(", ");
    setStatus(`${S.sources.length} sources · roots: ${roots || "none"} · scanned ${data.scanned_at}`);
  }

  (async () => {
    try {
      await loadSources(false);
      if (location.hash) await applyHash();
      else if (S.sources.length) {
        const first = S.sources.find((s) => (s.counts || {}).messages) || S.sources[0];
        await openSource(first.id, null);
      }
    } catch (err) {
      setStatus("Error loading sources: " + err.message);
    }
  })();
})();
</script>
</body>
</html>
