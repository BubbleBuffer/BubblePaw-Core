# A Windows bubblepaw binary of a branch, for measuring it: push the branch to
# bench-build/<name> and download the artifact. Same build as release.yml.
name: bench-build

on:
  push:
    branches: ['bench-build/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc && rustup default stable
      - name: build
        shell: bash
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p bubblepaw-runner --bin bubblepaw
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bubblepaw-windows
          path: target/x86_64-pc-windows-msvc/release/bubblepaw.exe
          if-no-files-found: error
          retention-days: 7
