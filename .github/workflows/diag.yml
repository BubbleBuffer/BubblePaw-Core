name: diag
on:
  push:
    branches: [fix/parity-windows]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: parity loop
        shell: bash
        run: |
          cargo test -p bubblepaw-runner --features web --locked --test host_api_parity --no-run
          for i in $(seq 1 12); do
            echo "=== iteration $i"
            cargo test -p bubblepaw-runner --features web --locked --test host_api_parity every_transport 2>&1 | grep -E "disagree|DIAGHISTORY|test result|rpc:|stdio:" | cut -c1-6000 || true
          done
