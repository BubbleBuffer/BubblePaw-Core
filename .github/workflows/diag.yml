name: diag
on:
  push:
    branches: [fix/parity-windows]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: parity loop
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test -p bubblepaw-runner --features web --locked --test host_api_parity --no-run
          for i in $(seq 1 30); do
            echo "=== iteration $i"
            if ! cargo test -p bubblepaw-runner --features web --locked --test host_api_parity > out.txt 2>&1; then
              echo "FAILED iteration $i"
              grep -n -B3 -A12 "panicked" out.txt | cut -c1-5000 || true; tail -n 3 <(grep "^STEP" out.txt) || true
              grep -o "DIAGHISTORY[^\"]*" out.txt | sed 's/ || / ## /g' | head -80 || true
              grep -n "stderr\|WARN\|ERROR" out.txt | cut -c1-400 | head -30 || true
            fi
          done
