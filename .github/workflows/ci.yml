# CI for the public BubblePaw-Core repo, on GitHub-hosted runners.
#
# Pushes to main and every pull request run all jobs; nothing here
# calls a paid model.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - "LICENSE*"
      - "NOTICE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - "LICENSE*"
      - "NOTICE*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No debug info in test builds. Debug info makes up most of each test binary,
# and the runner alone has about 140 integration-test binaries per feature set;
# with it, the hosted runner's disk filled.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # The image ships about 30 GB of SDKs this job never uses.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      # Caches the cargo registry and git sources only, not build output, so
      # the cache cannot grow from run to run. Only GitHub-owned and verified
      # actions are allowed in this repo.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: cargo fmt
        run: cargo fmt --all --check
      # Later gates run even when an earlier one fails, so one run reports all of them.
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A deprecated
      - name: cargo clippy (web, bench)
        if: ${{ !cancelled() }}
        run: cargo clippy -p bubblepaw-runner --features web,bench --all-targets --locked -- -D warnings -A deprecated
      - name: core, mcp, process and sdk tests
        if: ${{ !cancelled() }}
        run: cargo test -p bubblepaw-core -p bubblepaw-mcp -p bubblepaw-process -p bubblepaw-sdk --locked --no-fail-fast
      - name: runner tests (default features)
        if: ${{ !cancelled() }}
        run: cargo test -p bubblepaw-runner --locked --no-fail-fast
      # Drop the default-feature runner test binaries before building the
      # web,bench set, so only one set is on disk at a time.
      - name: clean runner build output
        if: ${{ !cancelled() }}
        run: cargo clean -p bubblepaw-runner && df -h /
      - name: runner tests (web, bench)
        if: ${{ !cancelled() }}
        run: cargo test -p bubblepaw-runner --features web,bench --locked --no-fail-fast
      - name: disk use
        if: ${{ always() }}
        run: df -h / && du -sh target

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: core, mcp, process and sdk tests
        run: cargo test -p bubblepaw-core -p bubblepaw-mcp -p bubblepaw-process -p bubblepaw-sdk --locked --no-fail-fast
      - name: runner tests (web, bench)
        if: ${{ !cancelled() }}
        run: cargo test -p bubblepaw-runner --features web,bench --locked --no-fail-fast

  claude-code-extension:
    name: claude-code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/claude-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        if: ${{ !cancelled() }}
        run: bun test
