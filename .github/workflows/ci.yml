# CI for the public BubblePaw-Core repo, on GitHub-hosted runners.
#
# This file lives in BubblePaw-base under .github/public/ so it never runs
# there; scripts/publish-public.sh moves it to .github/workflows/ci.yml in the
# export. Pushes to main and every pull request run all jobs; nothing here
# calls a paid model.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No debug info in test builds. Debug info makes up most of each test binary,
# and the runner alone has about 140 integration-test binaries per feature set;
# with it, the hosted runner's disk filled.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # The image ships about 30 GB of SDKs this job never uses.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      # Caches the registry and compiled dependencies only, not workspace
      # build output, so the cache cannot grow from run to run.
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      # Later gates run even when an earlier one fails, so one run reports all of them.
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A deprecated
      - name: cargo clippy (web, bench)
        if: ${{ !cancelled() }}
        run: cargo clippy -p bubblepaw-runner --features web,bench --all-targets --locked -- -D warnings -A deprecated
      - name: core, mcp and process tests
        if: ${{ !cancelled() }}
        run: cargo test -p bubblepaw-core -p bubblepaw-mcp -p bubblepaw-process --locked --no-fail-fast
      - name: runner tests (default features)
        if: ${{ !cancelled() }}
        run: cargo test -p bubblepaw-runner --locked --no-fail-fast
      # Drop the default-feature runner test binaries before building the
      # web,bench set, so only one set is on disk at a time.
      - name: clean runner build output
        if: ${{ !cancelled() }}
        run: cargo clean -p bubblepaw-runner && df -h /
      - name: runner tests (web, bench)
        if: ${{ !cancelled() }}
        run: cargo test -p bubblepaw-runner --features web,bench --locked --no-fail-fast
      - name: disk use
        if: ${{ always() }}
        run: df -h / && du -sh target

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: core, mcp and process tests
        run: cargo test -p bubblepaw-core -p bubblepaw-mcp -p bubblepaw-process --locked --no-fail-fast
      - name: runner tests (web, bench)
        if: ${{ !cancelled() }}
        run: cargo test -p bubblepaw-runner --features web,bench --locked --no-fail-fast

  claude-code-extension:
    name: claude-code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/claude-code
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        if: ${{ !cancelled() }}
        run: bun test
