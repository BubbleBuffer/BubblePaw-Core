# Release for the public BubblePaw-Core repo: a pushed v* tag builds the
# bubblepaw binary for Linux and Windows, with default features and with the
# web feature, and attaches the archives to a GitHub release for that tag.
#
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, variant: default, features: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, variant: web, features: web }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, variant: default, features: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, variant: web, features: web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: build
        shell: bash
        run: |
          args=(--release --locked --target "${{ matrix.target }}" -p bubblepaw-runner --bin bubblepaw)
          if [[ -n "${{ matrix.features }}" ]]; then args+=(--features "${{ matrix.features }}"); fi
          cargo build "${args[@]}"
      - name: package
        shell: bash
        run: |
          name="bubblepaw-${GITHUB_REF_NAME}-${{ matrix.target }}"
          if [[ "${{ matrix.variant }}" != default ]]; then name+="-${{ matrix.variant }}"; fi
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [[ "${{ runner.os }}" == Windows ]]; then
            cp "target/${{ matrix.target }}/release/bubblepaw.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/bubblepaw" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-${{ matrix.variant }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes
