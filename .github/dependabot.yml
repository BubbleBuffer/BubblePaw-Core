version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github_actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: bun
    directory: "/extensions/claude-code"
    schedule:
      interval: monthly
    groups:
      bun:
        patterns:
          - "*"
